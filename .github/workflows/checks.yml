name: Checks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      release-tag:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          activate-environment: true
      - run: uv pip install --upgrade ruff cffconvert packaging
      - run: ruff check .
      - run: ruff format --check .
      - run: cffconvert --validate
      - run: python -m unittest discover -s .github/scripts/tests -v

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install native build dependencies
        if: matrix.python-version == '3.15'
        run: sudo apt-get update && sudo apt-get install -y gfortran libfftw3-dev libopenblas-dev pkg-config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - run: uv pip install --upgrade -e ".[test]"
      - run: python -m pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.15'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.xml
          format: cobertura

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y gfortran libfftw3-dev libopenblas-dev pkg-config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14" # Match the Read the Docs build environment.
          activate-environment: true
      - run: uv pip install --upgrade -e ".[docs]"
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: docs/_build/html
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          activate-environment: true
      - run: uv pip install --upgrade build twine check-wheel-contents packaging
      - name: Verify release commit belongs to main
        if: inputs.release-tag != ''
        run: git merge-base --is-ancestor HEAD origin/main
      - run: python -m build
      - run: twine check --strict dist/*
      - run: check-wheel-contents dist/*.whl
      - name: Validate distribution names and versions
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python .github/scripts/validate_release.py pygeoid
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  installed:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [wheel, sdist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y gfortran libfftw3-dev libopenblas-dev pkg-config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          activate-environment: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - run: python .github/scripts/check_distribution.py pygeoid ${{ matrix.distribution }}
