name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.xml
          format: cobertura

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            docs/**/*

      - name: Install documentation dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[docs]"

      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [wheel, sdist]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install build check-wheel-contents twine
          python -m build
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
      - name: Test installed distribution outside checkout
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          python -m venv "$RUNNER_TEMP/package-env"
          package_python="$RUNNER_TEMP/package-env/bin/python"
          if [ "$DISTRIBUTION" = wheel ]; then
            "$package_python" -m pip install dist/*.whl pytest
          else
            "$package_python" -m pip install dist/*.tar.gz pytest
          fi
          cp -R tests "$RUNNER_TEMP/package-tests"
          cd "$RUNNER_TEMP"
          "$package_python" -c "import pathlib, sysconfig, pygeoid; assert pathlib.Path(pygeoid.__file__).is_relative_to(sysconfig.get_path('purelib')); assert pygeoid.__version__ not in ('0.0.0', '0+unknown'); print(pygeoid.__version__)"
          "$package_python" -m pytest package-tests -q -o addopts=
