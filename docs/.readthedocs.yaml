# Compatibility path for existing Read the Docs project settings.
version: 2

build:
  os: ubuntu-24.04
  apt_packages:
    - gfortran
    - libfftw3-dev
    - libopenblas-dev
    - pkg-config
  tools:
    python: "3.15"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
